name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The plotter and its tests only need numpy and matplotlib; training needs
      # DeepXDE and TensorFlow, which are too heavy to install on every push.
      - run: pip install numpy matplotlib pytest ruff
      - run: ruff check --select E9,F .
      - run: python -m pytest -q
